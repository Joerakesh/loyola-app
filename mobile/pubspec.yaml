name: loyola_erp
description: "Loyola College Student ERP mobile application."
publish_to: "none"

version: 1.0.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  dio: ^5.11.0
  flutter_secure_storage: ^11.1.0
  go_router: ^18.0.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  crypto: ^3.0.7
  lottie: ^3.1.0
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  google_sign_in: ^7.2.0
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/themes/
